<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="dialog.css">
    <link rel="stylesheet" href="main_content.css">
    <link rel="stylesheet" href="footer.css">
    <script src="main.js" defer></script>
</head>
<body>
    <div id="header">
        <div id="header-left">
            <img src="./pictures/book.jpg" alt="a picture of a book on a table">
            <h1>Library</h1>
        </div>
        <div id="header-right">
            <button id="add-book" command="show-modal" commandfor="book-form">Add Book</button>
        </div>
    </div>
    <dialog id="book-form">
        <form method="post" action="">
            <div>
                <label for="book_name">Book Name :</label>
                <input type="text" id="book_name" name="book_name" required/>
            </div>
            <div>
                <label for="author_name">Author :</label>
                <input type="text" id="author_name" name="author_name"/>
            </div>
            <div>
                <label for="publication_year">Publication Date :</label>
                <input type="tel" id="publication_year" name="publication_year" min="0" max="3000"/>
            </div>
            <div>
                <label for="current_status">Current Status :</label>
                <select name="current_status" id="current_status">
                    <option value="Reading">Reading</option>
                    <option value="Plan To Read">Plan To Read</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div id="formBtn">
                <button id="close_btn">Close</button>
                <button id="submitBtn" type="submit">Submit</button>
            </div>
        </form>
    </dialog>
    <div id="main-content"></div>
    <div id="footer">Thank You For Visiting</div>
</body>
</html>
