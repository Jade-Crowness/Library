<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./main.js" defer></script>
    <title>Library</title>
</head>
<body>
    <header>
        <div id="logo">
            <img src="./Pictures/library-logo.jpg" alt="logo of the site">
            <h1>Library</h1>
        </div>
        <div id="links">
            <ul>
                <li><button id="addBtn">Add Book</button></li>
                <li><a href="">About</a></li>
                <li><a href="">Sign Up</a></li>
            </ul>
        </div>
    </header>
    <main>
        <div id="temp"></div>
        <div id="book-form">
            <form action="" method="post">
                <div>
                    <h1>Library</h1>
                    <p>Fill Out The Book Details ^_^</p>
                    <hr>
                </div>
                <div>
                    <label for="book-name">Book Name</label>
                    <input type="text" id="book-name" name="book-name">
                </div>
                <div>
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author">
                </div>
                <div>
                    <label for="publication">Year of Publication</label>
                    <input type="number" id="publication" name="publication" min="0" max="2027">
                </div>
                <div>
                    <label for="status">Current Status</label>
                    <select id="status">
                        <option value="reading">Reading</option>
                        <option value="completed">Completed</option>
                        <option value="plan to read">Plan To Read</option>
                    </select>
                </div>
                <div id="buttons">
                    <button type="button" id="submit-button">Submit</button>
                    <button type="button" id="cancel-button">Cancel</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
